<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج القنوات الرياضية | LiveSoccerTV</title>
    <style>
        :root {
            --accent-color: #00ff73; /* لون أخضر فوسفوري رياضي */
            --accent-hover: #00cc5c;
            --text-color: #ffffff;
            --text-muted: #cbd5e1;
            --card-bg: rgba(21, 28, 43, 0.85); /* لون داكن شبه شفاف */
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* خلفية ملعب مع طبقة تعتيم لبروز النصوص */
            background: linear-gradient(rgba(9, 15, 28, 0.88), rgba(9, 15, 28, 0.88)), 
                        url('https://images.unsplash.com/photo-1518605368461-1ee7c532066d?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(0, 255, 115, 0.3);
            font-size: 2.2em;
        }
        
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            font-family: monospace;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(0, 255, 115, 0.2);
        }

        .buttons-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
            box-shadow: 0 4px 15px rgba(0, 255, 115, 0.2);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background-color: #2b3b5c;
            color: #fff;
            box-shadow: none;
        }

        .secondary-btn:hover {
            background-color: #3b4d75;
        }

        .results {
            display: grid;
            gap: 15px;
        }

        .channel-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            backdrop-filter: blur(12px); /* تأثير الزجاج */
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .channel-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 255, 115, 0.3);
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .channel-name {
            font-size: 19px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .channel-name::before {
            content: '📺';
            font-size: 0.9em;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .custom-link-badge {
            background-color: rgba(0, 255, 115, 0.1);
            color: var(--accent-color);
            border-color: rgba(0, 255, 115, 0.3);
        }

        .custom-link-badge:hover {
            background-color: rgba(0, 255, 115, 0.2);
        }

        .countries-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .country-tag {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ مستخرج القنوات الرياضية</h1>
    <p class="subtitle">حدد الجدول من موقع LiveSoccerTV وانسخه ثم الصقه هنا لترتيبه واستخراج الروابط</p>
    
    <div class="input-group">
        <textarea id="pasteArea" placeholder="الصق القنوات والدول هنا (Ctrl+V)..."></textarea>
        <div class="buttons-row">
            <button onclick="processPastedText()">⚡ ترتيب القنوات</button>
            <button onclick="exportToGitHub()" class="secondary-btn">💾 نسخ الروابط (لـ GitHub)</button>
        </div>
    </div>

    <div class="results" id="results"></div>
</div>

<script>
    let customLinks = {};

    async function loadSavedLinks() {
        // محاولة جلب الملف من جيت هاب لو موجود
        try {
            const res = await fetch('channels.json');
            if (res.ok) {
                const data = await res.json();
                customLinks = { ...data };
            }
        } catch (e) {
            console.log("جاري الاعتماد على الذاكرة المحلية.");
        }

        // دمج البيانات اللي تم تعديلها في المتصفح
        const localData = localStorage.getItem('custom_channel_links');
        if (localData) {
            customLinks = { ...customLinks, ...JSON.parse(localData) };
        }
    }

    loadSavedLinks();

    function processPastedText() {
        const text = document.getElementById('pasteArea').value.trim();
        const resultsDiv = document.getElementById('results');

        if (!text) {
            alert('يرجى لصق البيانات في المربع أولاً');
            return;
        }

        let channelsMap = {};
        const lines = text.split('\n');

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            let parts = line.split(/\t| {2,}/); 

            if (parts.length >= 2) {
                let country = parts[0].trim();
                
                for (let i = 1; i < parts.length; i++) {
                    let chName = parts[i].trim();
                    if (chName && chName.length > 1 && !chName.toLowerCase().includes('live stream') && !chName.toLowerCase().includes('tv schedule')) {
                        if (!channelsMap[chName]) {
                            channelsMap[chName] = new Set();
                        }
                        channelsMap[chName].add(country);
                    }
                }
            }
        });

        const sortedChannels = Object.keys(channelsMap).sort().reduce((acc, key) => {
            acc[key] = Array.from(channelsMap[key]);
            return acc;
        }, {});

        renderResults(sortedChannels);
    }

    function renderResults(channels) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        const keys = Object.keys(channels);
        if (keys.length === 0) {
            resultsDiv.innerHTML = '<p style="text-align:center; color: #ff4d4d; font-size: 1.2em;">لم يتم التعرف على قنوات. تأكد من نسخ الجدول كاملاً بشكل صحيح.</p>';
            return;
        }

        keys.forEach(channel => {
            const countries = channels[channel];
            const card = document.createElement('div');
            card.className = 'channel-card';

            const savedLink = customLinks[channel];
            const targetUrl = savedLink || `https://www.google.com/search?q=${encodeURIComponent(channel + " live streaming official")}`;

            card.innerHTML = `
                <div class="channel-header">
                    <span class="channel-name">${channel}</span>
                    <div class="actions">
                        <a href="${targetUrl}" target="_blank" class="icon-btn ${savedLink ? 'custom-link-badge' : ''}" title="افتح القناة">
                            ${savedLink ? '🔗 رابط القناة' : '🔍 بحث جوجل'}
                        </a>
                        <button onclick="addCustomLink('${channel}')" class="icon-btn" title="تعديل/إضافة رابط مباشر للقناة">⚙️ تعديل</button>
                    </div>
                </div>
                <div class="countries-list">
                    ${countries.map(c => `<span class="country-tag">${c}</span>`).join('')}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function addCustomLink(channelName) {
        const currentLink = customLinks[channelName] || '';
        const newLink = prompt(`أدخل الرابط المباشر لقناة "${channelName}":\n(اترك المربع فارغاً لمسح الرابط والعودة لبحث جوجل)`, currentLink);

        if (newLink !== null) {
            if (newLink.trim() === '') {
                delete customLinks[channelName];
            } else {
                customLinks[channelName] = newLink.trim();
            }
            localStorage.setItem('custom_channel_links', JSON.stringify(customLinks));
            processPastedText();
        }
    }

    // الدالة الجديدة الخاصة بنسخ كود الروابط لرفعه على جيت هاب
    function exportToGitHub() {
        if (Object.keys(customLinks).length === 0) {
            alert("ليس لديك أي قنوات محفوظة حالياً لتصديرها.");
            return;
        }

        // تحويل البيانات لشكل JSON منسق ومرتب
        const jsonString = JSON.stringify(customLinks, null, 4);

        // نسخ النص للحافظة (Clipboard)
        navigator.clipboard.writeText(jsonString).then(() => {
            alert("✅ تم نسخ الروابط بنجاح!\n\nاذهب الآن إلى حسابك في GitHub، افتح ملف channels.json، وامسح محتواه القديم والصق هذا الكود.");
        }).catch(err => {
            alert("حدث خطأ أثناء النسخ. يمكنك نسخ الكود من النافذة التالية:");
            prompt("انسخ الكود بالأسفل (Ctrl+C):", jsonString);
        });
    }
</script>

</body>
</html>
