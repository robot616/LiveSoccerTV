<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستخرج ومرتب القنوات</title>
    <style>
        :root {
            --bg-color: #121826;
            --card-bg: #1b2333;
            --accent-color: #00d26a;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #2d3748;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 10px;
        }
        
        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            font-family: monospace;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #121826;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
            align-self: center;
            min-width: 200px;
        }

        button:hover {
            opacity: 0.9;
        }

        .results {
            display: grid;
            gap: 15px;
        }

        .channel-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .channel-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .icon-btn:hover {
            background-color: #2d3748;
            color: var(--accent-color);
        }

        .countries-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .country-tag {
            background-color: #242f42;
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .custom-link-badge {
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مستخرج ومرتب القنوات</h1>
    <p class="subtitle">حدد الجدول من موقع LiveSoccerTV بالماوس (من أول دولة لآخر قناة)، انسخه (Ctrl+C)، ثم الصقه هنا (Ctrl+V)</p>
    
    <div class="input-group">
        <textarea id="pasteArea" placeholder="الصق القنوات والدول هنا..."></textarea>
        <button onclick="processPastedText()">ترتيب القنوات</button>
    </div>

    <div class="results" id="results"></div>
</div>

<script>
    // تخزين روابط القنوات
    let customLinks = {};

    // تحميل الروابط من المتصفح عند فتح الصفحة
    function loadSavedLinks() {
        const localData = localStorage.getItem('custom_channel_links');
        if (localData) {
            customLinks = JSON.parse(localData);
        }
    }

    loadSavedLinks();

    function processPastedText() {
        const text = document.getElementById('pasteArea').value.trim();
        const resultsDiv = document.getElementById('results');

        if (!text) {
            alert('يرجى لصق البيانات في المربع أولاً');
            return;
        }

        let channelsMap = {};
        const lines = text.split('\n');

        lines.forEach(line => {
            // تنظيف السطر
            line = line.trim();
            if (!line) return;

            // عندما تقوم بنسخ جدول من المتصفح، يتم فصل الأعمدة بمسافة Tab (\t)
            // إذا لم يجد Tab، سيحاول الفصل بالمسافات الكبيرة الناتجة عن النسخ
            let parts = line.split(/\t| {2,}/); 

            if (parts.length >= 2) {
                // الجزء الأول دائماً يكون الدولة
                let country = parts[0].trim();
                
                // الأجزاء الباقية هي القنوات
                for (let i = 1; i < parts.length; i++) {
                    let chName = parts[i].trim();
                    // تجاهل الكلمات غير المفيدة
                    if (chName && chName.length > 1 && !chName.toLowerCase().includes('live stream') && !chName.toLowerCase().includes('tv schedule')) {
                        if (!channelsMap[chName]) {
                            channelsMap[chName] = new Set();
                        }
                        channelsMap[chName].add(country);
                    }
                }
            }
        });

        // الترتيب الأبجدي للقنوات
        const sortedChannels = Object.keys(channelsMap).sort().reduce((acc, key) => {
            acc[key] = Array.from(channelsMap[key]);
            return acc;
        }, {});

        renderResults(sortedChannels);
    }

    function renderResults(channels) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        const keys = Object.keys(channels);
        if (keys.length === 0) {
            resultsDiv.innerHTML = '<p style="text-align:center; color: #ef4444;">لم يتم التعرف على قنوات. تأكد من نسخ الجدول كاملاً بشكل صحيح.</p>';
            return;
        }

        keys.forEach(channel => {
            const countries = channels[channel];
            const card = document.createElement('div');
            card.className = 'channel-card';

            // تحديد الرابط: هل هو محفوظ أم رابط بحث جوجل؟
            const savedLink = customLinks[channel];
            const targetUrl = savedLink || `https://www.google.com/search?q=${encodeURIComponent(channel + " live streaming")}`;

            card.innerHTML = `
                <div class="channel-header">
                    <span class="channel-name">${channel}</span>
                    <div class="actions">
                        <a href="${targetUrl}" target="_blank" class="icon-btn ${savedLink ? 'custom-link-badge' : ''}" title="افتح القناة">
                            🔗 ${savedLink ? 'رابط القناة' : 'بحث جوجل'}
                        </a>
                        <button onclick="addCustomLink('${channel}')" class="icon-btn" title="أضف أو عدل رابط هذه القناة">⚙️</button>
                    </div>
                </div>
                <div class="countries-list">
                    ${countries.map(c => `<span class="country-tag">${c}</span>`).join('')}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function addCustomLink(channelName) {
        const currentLink = customLinks[channelName] || '';
        const newLink = prompt(`أدخل الرابط المباشر لقناة "${channelName}":\n(اترك المربع فارغاً لمسح الرابط والعودة لبحث جوجل)`, currentLink);

        if (newLink !== null) {
            if (newLink.trim() === '') {
                delete customLinks[channelName]; // حذف الرابط إذا تركه فارغاً
            } else {
                customLinks[channelName] = newLink.trim(); // حفظ الرابط الجديد
            }
            // حفظ التغييرات في ذاكرة المتصفح
            localStorage.setItem('custom_channel_links', JSON.stringify(customLinks));
            
            // إعادة رسم القنوات لتحديث شكل الزر فوراً (من بحث جوجل إلى رابط القناة)
            processPastedText();
        }
    }
</script>

</body>
</html>
