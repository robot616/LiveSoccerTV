<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveSoccerTV</title>
    <!-- أيقونة شريط المتصفح -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
    <!-- أيقونة عند حفظ الموقع كبرنامج على سطح المكتب أو الهاتف -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
    <style>
        :root {
            --accent-color: #00ff73; 
            --accent-hover: #00cc5c;
            --text-color: #ffffff;
            --text-muted: #e2e8f0;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(9, 15, 28, 0.6), rgba(9, 15, 28, 0.8)), 
                        url('https://images.unsplash.com/photo-1614632537190-23e4146777db?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            font-size: 2.2em;
        }
        
        p.subtitle {
            text-align: center;
            color: #f8fafc;
            text-shadow: 0 1px 5px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.55);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* مربع النصوص الغنية الجديد بدلاً من textarea */
        .paste-area {
            width: 100%;
            height: 140px;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 16px;
            outline: none;
            overflow-y: auto;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .paste-area:empty:before {
            content: attr(data-placeholder);
            color: rgba(255, 255, 255, 0.5);
        }
        .paste-area:focus {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(0, 255, 115, 0.3);
        }

        .search-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.7);
        }

        .buttons-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 200px;
            box-shadow: 0 4px 15px rgba(0, 255, 115, 0.3);
        }

        button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .secondary-btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }

        .secondary-btn:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
        
        .danger-btn {
            background-color: rgba(255, 50, 50, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 50, 50, 0.5);
            box-shadow: none;
        }
        
        .danger-btn:hover {
            background-color: rgba(255, 50, 50, 0.4);
        }

        .results {
            display: grid;
            gap: 15px;
        }

        .channel-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            backdrop-filter: blur(10px); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, border-color 0.2s;
        }

        .channel-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 255, 115, 0.5);
        }

        .channel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .channel-name {
            font-size: 19px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .channel-name::before {
            content: '📺';
            font-size: 1em;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .custom-link-badge {
            background-color: rgba(0, 255, 115, 0.15);
            color: var(--accent-color);
            border-color: rgba(0, 255, 115, 0.4);
        }

        .custom-link-badge:hover {
            background-color: rgba(0, 255, 115, 0.25);
        }

        .countries-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .country-tag {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ LiveSoccerTV</h1>
    <p class="subtitle" id="mainSubtitle">حدد الجدول من موقع LiveSoccerTV وانسخه ثم الصقه هنا لترتيبه واستخراج الروابط</p>
    
    <!-- قسم الإدخال (يختفي بعد السحب) -->
    <div class="control-panel" id="inputSection">
        <div id="pasteArea" class="paste-area" contenteditable="true" data-placeholder="الصق الجدول هنا (Ctrl+V)... سيتم الحفاظ على التنسيق لفصل القنوات بدقة"></div>
        <div class="buttons-row">
            <button onclick="processPastedText()">⚡ ترتيب القنوات</button>
            <button onclick="exportToGitHub()" class="secondary-btn">💾 نسخ الروابط (لـ GitHub)</button>
        </div>
    </div>

    <!-- قسم البحث والمسح (يظهر فقط بعد السحب) -->
    <div class="control-panel" id="postActions" style="display: none;">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث عن قناة أو دولة...">
        <div class="buttons-row">
            <button onclick="resetPage()" class="danger-btn">🧹 مسح وبحث جديد</button>
            <button onclick="exportToGitHub()" class="secondary-btn">💾 تصدير الروابط</button>
        </div>
    </div>

    <div class="results" id="results"></div>
</div>

<script>
    let customLinks = {};

    async function loadSavedLinks() {
        try {
            const res = await fetch('channels.json');
            if (res.ok) {
                const data = await res.json();
                customLinks = { ...data };
            }
        } catch (e) {
            console.log("جاري الاعتماد على الذاكرة المحلية.");
        }

        const localData = localStorage.getItem('custom_channel_links');
        if (localData) {
            customLinks = { ...customLinks, ...JSON.parse(localData) };
        }
    }

    loadSavedLinks();

    function processPastedText() {
        const pasteArea = document.getElementById('pasteArea');
        const resultsDiv = document.getElementById('results');

        if (!pasteArea.textContent.trim()) {
            alert('يرجى لصق البيانات في المربع أولاً');
            return;
        }

        let channelsMap = {};
        
        // استخراج الصفوف من الجدول الملصوق (نفس طريقة الإضافة)
        const rows = pasteArea.querySelectorAll('tr');

        if (rows.length > 0) {
            // لو تم لصق جدول حقيقي
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length > 0) {
                    // الخلية الأولى عادة بتكون الدولة
                    let countryName = cells[0].textContent.trim();
                    
                    // الخلية التانية فيها القنوات (روابط)
                    let channelLinks = row.querySelectorAll('a');
                    
                    if (channelLinks.length > 0) {
                        channelLinks.forEach(ch => {
                            let chName = ch.textContent.trim();
                            if (chName && chName.length > 1 && !chName.toLowerCase().includes('live stream') && !chName.toLowerCase().includes('tv schedule')) {
                                if (!channelsMap[chName]) channelsMap[chName] = new Set();
                                channelsMap[chName].add(countryName);
                            }
                        });
                    }
                }
            });
        } else {
            // كود بديل لو تم لصق نص عادي
            const lines = pasteArea.innerText.split('\n');
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                let parts = line.split(/\t| {2,}/); 
                if (parts.length >= 2) {
                    let country = parts[0].trim();
                    for (let i = 1; i < parts.length; i++) {
                        let chName = parts[i].trim();
                        if (chName && chName.length > 1 && !chName.toLowerCase().includes('live stream') && !chName.toLowerCase().includes('tv schedule')) {
                            if (!channelsMap[chName]) channelsMap[chName] = new Set();
                            channelsMap[chName].add(country);
                        }
                    }
                }
            });
        }

        const sortedKeys = Object.keys(channelsMap).sort();
        
        if (sortedKeys.length === 0) {
            resultsDiv.innerHTML = '<p style="text-align:center; color: #ff4d4d; font-size: 1.2em; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;">لم يتم التعرف على قنوات. تأكد من نسخ الجدول كاملاً بشكل صحيح.</p>';
            return;
        }

        const sortedChannels = sortedKeys.reduce((acc, key) => {
            acc[key] = Array.from(channelsMap[key]);
            return acc;
        }, {});

        renderResults(sortedChannels);
        
        // إخفاء مربع اللصق وإظهار مربع البحث
        document.getElementById('inputSection').style.display = 'none';
        document.getElementById('postActions').style.display = 'flex';
        document.getElementById('mainSubtitle').style.display = 'none';
        document.getElementById('searchInput').value = ''; 
    }

    function renderResults(channels) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        const keys = Object.keys(channels);
        
        keys.forEach(channel => {
            const countries = channels[channel];
            const card = document.createElement('div');
            card.className = 'channel-card';

            const savedLink = customLinks[channel];
            const targetUrl = savedLink || `https://www.google.com/search?q=${encodeURIComponent(channel + " live streaming official")}`;

            card.innerHTML = `
                <div class="channel-header">
                    <span class="channel-name">${channel}</span>
                    <div class="actions">
                        <a href="${targetUrl}" target="_blank" class="icon-btn ${savedLink ? 'custom-link-badge' : ''}" title="افتح القناة">
                            ${savedLink ? '🔗 رابط القناة' : '🔍 بحث جوجل'}
                        </a>
                        <button onclick="addCustomLink('${channel}')" class="icon-btn" title="تعديل/إضافة رابط مباشر للقناة">⚙️ تعديل</button>
                    </div>
                </div>
                <div class="countries-list">
                    ${countries.map(c => `<span class="country-tag">${c}</span>`).join('')}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    // ميزة البحث اللحظي في القنوات والدول
    document.getElementById('searchInput').addEventListener('input', function() {
        const searchTerm = this.value.toLowerCase().trim();
        const cards = document.querySelectorAll('.channel-card');
        
        cards.forEach(card => {
            const channelName = card.querySelector('.channel-name').textContent.toLowerCase();
            const countries = card.querySelector('.countries-list').textContent.toLowerCase();
            
            if (channelName.includes(searchTerm) || countries.includes(searchTerm)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    });

    // دالة مسح كل شيء والعودة للبداية
    function resetPage() {
        document.getElementById('pasteArea').innerHTML = ''; // مسح محتوى مربع الإدخال
        document.getElementById('results').innerHTML = '';
        document.getElementById('postActions').style.display = 'none';
        document.getElementById('inputSection').style.display = 'flex';
        document.getElementById('mainSubtitle').style.display = 'block';
    }

    function addCustomLink(channelName) {
        const currentLink = customLinks[channelName] || '';
        const newLink = prompt(`أدخل الرابط المباشر لقناة "${channelName}":\n(اترك المربع فارغاً لمسح الرابط والعودة لبحث جوجل)`, currentLink);

        if (newLink !== null) {
            if (newLink.trim() === '') {
                delete customLinks[channelName];
            } else {
                customLinks[channelName] = newLink.trim();
            }
            localStorage.setItem('custom_channel_links', JSON.stringify(customLinks));
            processPastedText();
        }
    }

    function exportToGitHub() {
        if (Object.keys(customLinks).length === 0) {
            alert("ليس لديك أي قنوات محفوظة حالياً لتصديرها.");
            return;
        }

        const jsonString = JSON.stringify(customLinks, null, 4);

        navigator.clipboard.writeText(jsonString).then(() => {
            alert("✅ تم نسخ الروابط بنجاح!\n\nاذهب الآن إلى حسابك في GitHub، افتح ملف channels.json، وامسح محتواه القديم والصق هذا الكود.");
        }).catch(err => {
            alert("حدث خطأ أثناء النسخ. يمكنك نسخ الكود من النافذة التالية:");
            prompt("انسخ الكود بالأسفل (Ctrl+C):", jsonString);
        });
    }
</script>

</body>
</html>
